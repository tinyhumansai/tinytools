[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the crate a host links is `crates/tinytools`, the same as any other
# member.
members = ["crates/*"]
# `worktrees/` holds `git worktree` checkouts of this same repository; each
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
exclude = ["worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinytools"

[workspace.dependencies]
# The tool trait is `async`, so it needs the object-safety shim until native
# async-in-trait supports `dyn`. This is the single heaviest thing this crate
# asks of a host, and it is already in every consumer's graph.
async-trait = "0.1"
# Tool results, specs and the permission vocabulary are serialized: into agent
# transcripts, into RPC replies, and into the JSONL session records hosts keep
# on disk.
serde = { version = "1", features = ["derive"] }
# Tool arguments and JSON Schema parameter shapes are untyped by nature.
serde_json = "1"
# `Tool::execute` returns `anyhow::Result` because a tool body calls arbitrary
# host code and has no useful closed error set of its own.
anyhow = "1"
# Unit tests for the async trait defaults drive a real executor.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
